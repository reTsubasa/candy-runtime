[workspace]
resolver = "2"
members = [
  "linux/common/apps/candy-cloud-enroll",
  "linux/common/apps/candy-netd",
  "linux/common/apps/candy-sdwan-agent",
  "linux/common/crates/candy-netd-client",
  "linux/common/crates/candy-netd-proto",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/reTsubasa/candy-runtime"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8", "rand_core"] }
futures-util = "0.3"
netlink-packet-route = "0.30"
nix = { version = "0.29", features = ["fs", "net", "socket", "uio", "user"] }
rtnetlink = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
x509-parser = "0.18"
