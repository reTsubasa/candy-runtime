<style>
.candy-log-summary { display:flex; align-items:center; justify-content:space-between; gap:1em; padding:.9em 0; border-top:1px solid #e5e6eb; border-bottom:1px solid #e5e6eb; }
.candy-log-summary strong, .candy-log-summary span { display:block; }
.candy-log-summary span { margin-top:.2em; color:#4e5969; line-height:1.5; }
@media (max-width:560px) { .candy-log-summary { align-items:flex-start; flex-direction:column; } }
</style>
<div class="cbi-map" id="candy-diagnostics-logs">
	<h3><%:Logs%></h3>
	<div class="cbi-section candy-log-summary">
		<div><strong><%:Service and traffic events%></strong><span><%:Filter Runtime, Core, update, SD-WAN, system, and user traffic events on the Logs page.%></span></div>
		<a class="cbi-button cbi-button-action" href="<%=luci.dispatcher.build_url('admin', 'services', 'candy', 'logs')%>"><%:Open logs%></a>
	</div>
</div>
