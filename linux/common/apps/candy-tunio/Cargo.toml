[package]
name = "candy-tunio"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.88"

[workspace]

[dependencies]
anyhow = "1"
candy-packet-port = { path = "../../../../shared/vendor/candy-packet-port" }
candy-netd-client = { path = "../../crates/candy-netd-client" }
candy-netd-proto = { path = "../../crates/candy-netd-proto" }
candy-process-control = { path = "../../crates/candy-process-control" }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "net", "socket", "uio", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

