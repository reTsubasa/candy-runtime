listen = "0.0.0.0:8443"

# For root-level Compose, use ./server.example.toml instead.
#
# Production deployments must mount certificate files readable by UID 10001.
# The container fails to start when either file is missing.
cert_pem = "/etc/carrier/server.crt"
key_pem = "/etc/carrier/server.key"

# Process API v1 does not manage ECH key generation or rotation. The base
# Runtime therefore leaves ECH disabled instead of creating key material.

# Optional keyed port hopping. Keep empty to listen only on the primary port.
[port_hopping]
ports = []

[admission]
# Bound total live QUIC connections and authentication work.
max_connections = 1024
auth_timeout_seconds = 10
# Bound authenticated connections independently for each configured user.
max_connections_per_user = 8

[limits]
max_sessions_per_connection = 256
max_udp_flows = 256
max_datagram_size = 65536

[qos]
# Duplicate each UDP response packet up to 3 times for weak links.
# Keep this at 1 unless the client link probe recommends redundancy.
server_udp_multiplier = 1
# Disabled by default: when enabled, the server accepts the client's proposed
# server_udp_multiplier from the Candy handshake for this connection.
accept_client_udp_multiplier_proposal = false
# Optional reverse proposal: when enabled, the client uses this multiplier for
# client-to-server UDP packets. Candy clients accept this by default.
propose_client_udp_multiplier = false
client_udp_multiplier = 1

[[users]]
key_id = "change-me"
secret = "replace-with-at-least-16-random-bytes"
# Includes negotiated fragmentation and automatic FEC.
features = ["recommended"]

# Private Transit Hub (T4) is mutually exclusive with ordinary users,
# sdwan_tun, and sdwan_shared_transit. The primary listen accepts only
# Cloud-authenticated Device Site tunnels; fabric_listen accepts only Node
# Grant/NodeProof HUB_FABRIC_V1 connections.
