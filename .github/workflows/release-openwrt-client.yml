name: release-openwrt-client

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - Cargo.lock
      - Cargo.toml
      - linux/**
      - packaging/linux/**
      - packaging/openwrt/**
      - openwrt/client/packages/candy-client/**
      - openwrt/client/packages/luci-app-candy/**
      - .github/workflows/release-openwrt-client.yml
      - docs/**
      - scripts/**
      - openwrt/client/tests/**
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Immutable Runtime commit to build (40 or 64 hex characters)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-openwrt-client-0.4.0-r104
  cancel-in-progress: false

env:
  CANDY_RELEASE_VERSION: "0.4.0"
  CANDY_RELEASE_REVISION: "104"
  OPENWRT_RELEASE: "25.12.4"
  OPENWRT_GCC_VERSION: "14.3.0"
  RELEASE_REPOSITORY: reTsubasa/candy-release
  SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable Runtime commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Validate Runtime release version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = reTsubasa/candy-runtime
          printf '%s' "$SOURCE_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}([0-9a-fA-F]{24})?$'
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$SOURCE_COMMIT")"
          test "$(tr -d '\r\n' < VERSION)" = "$CANDY_RELEASE_VERSION"
          test "$(sed -n 's/^PKG_VERSION:=//p' openwrt/client/packages/candy-client/Makefile)" = "$CANDY_RELEASE_VERSION"
          test "$(sed -n 's/^PKG_VERSION:=//p' openwrt/client/packages/luci-app-candy/Makefile)" = "$CANDY_RELEASE_VERSION"
          test "$(sed -n 's/^PKG_RELEASE:=//p' openwrt/client/packages/candy-client/Makefile)" = "$CANDY_RELEASE_REVISION"
          test "$(sed -n 's/^PKG_RELEASE:=//p' openwrt/client/packages/luci-app-candy/Makefile)" = "$CANDY_RELEASE_REVISION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,armv7-unknown-linux-musleabihf,aarch64-unknown-linux-gnu

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu jq ripgrep lua5.4 curl zstd

      - name: Install pinned ARMv7 musl toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CANDY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          arm_bin=$(scripts/install_pinned_arm_musl_toolchain.sh)
          echo "$arm_bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER=$arm_bin/armv7l-linux-musleabihf-gcc"
            echo "CC_armv7_unknown_linux_musleabihf=$arm_bin/armv7l-linux-musleabihf-gcc"
            echo "CXX_armv7_unknown_linux_musleabihf=$arm_bin/armv7l-linux-musleabihf-g++"
            echo "AR_armv7_unknown_linux_musleabihf=$arm_bin/armv7l-linux-musleabihf-ar"
          } >> "$GITHUB_ENV"

      - name: Run full Runtime verification
        run: scripts/verify.sh

      - name: Build Runtime executables
        shell: bash
        run: |
          set -euo pipefail
          packaging/openwrt/build/build_runtime.sh x86_64-unknown-linux-musl
          packaging/openwrt/build/build_runtime.sh armv7-unknown-linux-musleabihf

      - name: Build Linux server Runtime bundles
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          packaging/linux/build.sh x86_64-unknown-linux-musl
          packaging/linux/build.sh aarch64-unknown-linux-gnu

      - name: Build x86_64 OpenWrt client APKs
        env:
          CANDY_RUNTIME_BIN_DIR: ${{ github.workspace }}/dist/runtime/openwrt-client/x86_64
          OPENWRT_DIST_DIR: ${{ github.workspace }}/dist/openwrt/x86_64/apk
        run: packaging/openwrt/build/sdk_container_gate.sh apk x86_64

      - name: Build IPQ40xx OpenWrt client APKs
        env:
          CANDY_RUNTIME_BIN_DIR: ${{ github.workspace }}/dist/runtime/openwrt-client/arm_cortex-a7_neon-vfpv4
          OPENWRT_DIST_DIR: ${{ github.workspace }}/dist/openwrt/ipq40xx-generic/apk
        run: packaging/openwrt/build/sdk_container_gate.sh apk ipq40xx-generic

      - name: Validate and describe release artifacts
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist/openwrt
          source_commit=$(git rev-parse HEAD)
          CANDY_RELEASE_SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
            CANDY_RELEASE_SOURCE_COMMIT="$source_commit" \
            OPENWRT_PROFILE=x86_64 OPENWRT_RELEASE="$OPENWRT_RELEASE" \
            packaging/openwrt/build/prepare_runtime_release.sh dist/openwrt/x86_64/apk
          CANDY_RELEASE_SOURCE_REPOSITORY="$GITHUB_REPOSITORY" \
            CANDY_RELEASE_SOURCE_COMMIT="$source_commit" \
            OPENWRT_PROFILE=ipq40xx-generic OPENWRT_RELEASE="$OPENWRT_RELEASE" \
            packaging/openwrt/build/prepare_runtime_release.sh dist/openwrt/ipq40xx-generic/apk
          rm -rf dist/openwrt/merged
          packaging/openwrt/build/merge_runtime_release.sh \
            dist/openwrt/x86_64/apk dist/openwrt/ipq40xx-generic/apk dist/openwrt/merged
          packaging/linux/prepare_release.sh \
            dist/linux dist/openwrt/merged "$CANDY_RELEASE_VERSION" "$CANDY_RELEASE_REVISION" \
            "$GITHUB_REPOSITORY" "$source_commit"
          (cd dist/openwrt/merged && sha256sum -c SHA256SUMS)

      - name: Stage Runtime release and request central finalization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CANDY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tag="runtime-v$CANDY_RELEASE_VERSION-r$CANDY_RELEASE_REVISION"
          staging_tag="incoming-$tag"
          dist=dist/openwrt/merged
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Candy Runtime $CANDY_RELEASE_VERSION-r$CANDY_RELEASE_REVISION

          - Source: $GITHUB_REPOSITORY@$(git rev-parse HEAD)
          - Targets: OpenWrt $OPENWRT_RELEASE x86_64 and ipq40xx/generic; Linux x86_64 and ARM64
          - Package formats: APK and architecture-bound Linux tar.gz bundles
          EOF
          if gh release view "$staging_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$staging_tag" --repo "$RELEASE_REPOSITORY" --yes
          fi
          gh release create "$staging_tag" --repo "$RELEASE_REPOSITORY" --draft \
            --title "Incoming Candy Runtime $CANDY_RELEASE_VERSION-r$CANDY_RELEASE_REVISION" \
            --notes-file "$notes"
          gh release upload "$staging_tag" --repo "$RELEASE_REPOSITORY" "$dist"/*
          jq -n --arg tag "$staging_tag" '{event_type:"candy-artifact-ready",client_payload:{release_kind:"runtime",staging_tag:$tag}}' | \
            gh api --method POST "repos/$RELEASE_REPOSITORY/dispatches" --input -
