name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: scripts/verify.sh
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/linux/build.sh x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: candy-runtime-linux-server-x86_64
          path: |
            dist/linux/server/x86_64/
            dist/linux/serverd-linux-x86_64

  openwrt-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - id: runtime
        run: |
          stage=$(packaging/openwrt/build/build_runtime.sh x86_64-unknown-linux-musl)
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - run: CANDY_RUNTIME_BIN_DIR="${{ steps.runtime.outputs.stage }}" OPENWRT_RELEASE=25.12.4 OPENWRT_GCC_VERSION=14.3.0 packaging/openwrt/build/sdk_container_gate.sh apk x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: candy-runtime-openwrt-client-x86_64
          path: dist/openwrt/x86_64/apk/
